name: container validation
on:
  workflow_call:
    outputs:
      family-sha:
        value: ${{ jobs.family.outputs.family-sha }}
      server-sha:
        value: ${{ jobs.family.outputs.server-sha }}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.11@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f \
            -shellcheck='' .github/workflows/build.yml .github/workflows/containers.yml .github/workflows/release.yml
          shellcheck -x scripts/build-{server,calls,image,webapp}.sh scripts/e2e.sh scripts/ci/*.sh
          python3 -m unittest discover -s tests/ci -v
  family:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      family-sha: ${{ steps.build.outputs.family-sha }}
      server-sha: ${{ steps.build.outputs.server-sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.32.1
          driver-opts: image=moby/buildkit@sha256:37539dd4d60fc70968d164d3850d903a2c56f6402214a1953fbf9fcb81ada731
          buildkitd-flags: --oci-worker=true
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - id: build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
        run: scripts/ci/build-family.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-family
          path: family.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-validation-reports
          path: |
            out/*.json
            out/*.sha256
          retention-days: 7
  reproduce:
    needs: family
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.32.1
          driver-opts: image=moby/buildkit@sha256:37539dd4d60fc70968d164d3850d903a2c56f6402214a1953fbf9fcb81ada731
          buildkitd-flags: --oci-worker=true
      - env:
          EXPECTED_SERVER_SHA: ${{ needs.family.outputs.server-sha }}
        run: scripts/ci/reproduce.sh
