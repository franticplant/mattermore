name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# Serialize ALL releases; never cancel an in-flight publication.
concurrency:
  group: mattermore-release
  cancel-in-progress: false
jobs:
  guard:
    if: github.repository == 'franticplant/mattermore'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git -c gpg.ssh.allowedSignersFile=.github/signing/allowed_signers verify-commit "$GITHUB_SHA"
          git -c gpg.ssh.allowedSignersFile=.github/signing/allowed_signers verify-tag "$GITHUB_REF_NAME"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA&status=success" \
            --jq '.workflow_runs | length > 0' | grep -qx true
          # A missing/unprotected environment is a configuration error, not
          # permission to publish without approval.
          gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '[.protection_rules[].type] | index("required_reviewers") != null' | grep -qx true
  validate:
    needs: guard
    uses: ./.github/workflows/containers.yml
  publish:
    needs: validate
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, alpine, ubi, ubi-micro, debug]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-family
      - name: Verify trusted job handoff
        env:
          EXPECTED: ${{ needs.validate.outputs.family-sha }}
        run: |
          echo "$EXPECTED  family.tar" | sha256sum -c -
          tar xf family.tar
          (cd out && sha256sum -c SHA256SUMS)
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Registry login
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: push
        env:
          VARIANT: ${{ matrix.variant }}
        run: scripts/ci/publish-candidate.sh "$VARIANT"
      - name: Sign provenance for this index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Sign delivered-image SPDX for this index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: out/${{ matrix.variant }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.variant }}
          path: |
            out/${{ matrix.variant }}.candidate.json
            out/${{ matrix.variant }}.spdx.json
            out/${{ matrix.variant }}.scan.json
            out/inventory.json
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, alpine, ubi, ubi-micro, debug]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ matrix.variant }}
          path: out
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: |
          gh attestation verify --help | grep -q -- --bundle-from-oci
          scripts/ci/verify-registry.sh "$VARIANT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-${{ matrix.variant }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
  promote:
    needs: verify
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verified-*
          merge-multiple: true
          path: out
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/promote.sh
